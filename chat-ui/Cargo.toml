[package]
name = "chat-ui"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
# RFC3339 parsing for the sessions sidebar's date grouping
# (`session_groups.rs`). Never calls `Utc::now()` (unsupported on
# `wasm32-unknown-unknown` without the `wasmbind` feature) — "now" is always
# passed in as `now_ms`, computed by the caller from `js_sys::Date::now()`.
chrono = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", features = ["http"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
pulldown-latex = "0.8"
ammonia = "4"
web-sys = { version = "0.3", features = [
    "HtmlElement",
    "HtmlTextAreaElement",
    "HtmlInputElement",
    "Element",
    "CssStyleDeclaration",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "Window",
    "Navigator",
    "Clipboard",
    "Element",
    "EventTarget",
    "Node",
    "File",
    "FileList",
    "FileReader",
    "Blob",
    "ProgressEvent",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "DragEvent",
    "ClipboardEvent",
] }
