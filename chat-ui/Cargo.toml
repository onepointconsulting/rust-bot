[package]
name = "chat-ui"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", features = ["http"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
pulldown-latex = "0.8"
ammonia = "4"
web-sys = { version = "0.3", features = [
    "HtmlElement",
    "HtmlTextAreaElement",
    "HtmlInputElement",
    "Element",
    "CssStyleDeclaration",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "Window",
    "Navigator",
    "Clipboard",
    "File",
    "FileList",
    "FileReader",
    "Blob",
    "ProgressEvent",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "DragEvent",
    "ClipboardEvent",
] }
