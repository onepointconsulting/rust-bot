# rust-bot instance "{{PROJECT_NAME}}", generated by `rust-bot onboard --mode docker`.
#
#   docker compose up -d        start it (pulls or builds the image on first use)
#   docker compose logs -f      follow the logs
#   docker compose down         stop it (the files in ./data are kept)
#
# The web UI is then at http://127.0.0.1:{{HOST_PORT}}
# Re-run `rust-bot onboard --mode docker --dir <this folder>` to refresh or upgrade it.
name: {{PROJECT_NAME}}
services:
  rust-bot:
{{IMAGE_SOURCE}}
    container_name: {{PROJECT_NAME}}
    restart: unless-stopped
    # Secrets (API keys): the ${VAR} placeholders in data/config.json are expanded from these.
    env_file: .env.docker
    environment:
      # Log level. Logs go to the container's stdout: `docker compose logs`.
      RUST_LOG: ${RUST_LOG:-info}
{{USER_LINE}}    ports:
      # Published on the host's loopback only. Put an authenticating reverse proxy in front
      # before exposing it beyond this machine.
      - "127.0.0.1:{{HOST_PORT}}:{{CONTAINER_PORT}}"
    volumes:
      # Config, keys, users and all runtime state (workspace, sessions, cron).
      # Paths inside data/config.json are container paths (/data/...).
      - ./data:/data
