name: Release (Windows)

on:
  push:
    branches:
      - deployment

permissions:
  contents: write

jobs:
  build-package-release:
    name: Build, package and release (windows-x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $inPackage = $false
          $version = $null
          foreach ($line in Get-Content Cargo.toml) {
            if ($line -match '^\[package\]') { $inPackage = $true; continue }
            if ($inPackage -and $line -match '^\[') { break }
            if ($inPackage -and $line -match '^version\s*=\s*"([^"]+)"') {
              $version = $Matches[1]
              break
            }
          }
          if (-not $version) {
            Write-Error "Could not determine [package].version from Cargo.toml"
            exit 1
          }
          Write-Host "Resolved version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Ensure release tag is not already used by another commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $refOutput = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" 2>$null
          $apiExitCode = $LASTEXITCODE
          if ($apiExitCode -eq 0) {
            $existingSha = ($refOutput | ConvertFrom-Json).object.sha
            if ($existingSha -ne "$env:GITHUB_SHA") {
              Write-Error "Tag $tag already exists at $existingSha (current commit is $env:GITHUB_SHA). Bump the version in Cargo.toml before releasing again."
              exit 1
            }
            Write-Host "Tag $tag already points at the current commit; continuing."
          } else {
            Write-Host "Tag $tag does not exist yet; it will be created by this release."
          }

          # `gh api` (an external command) leaves a non-zero $LASTEXITCODE when the
          # tag lookup 404s. The GitHub Actions pwsh runner fails the step if
          # $LASTEXITCODE is non-zero when the script ends, even though we handled
          # that case above without calling `exit`. Reset it explicitly on success.
          exit 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64-pc-windows-msvc

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Install wasm-opt (Binaryen)
        shell: pwsh
        run: |
          $ver = "version_132"
          $url = "https://github.com/WebAssembly/binaryen/releases/download/$ver/binaryen-$ver-x86_64-windows.tar.gz"
          $archive = Join-Path $env:RUNNER_TEMP "binaryen.tar.gz"
          $dest = Join-Path $env:RUNNER_TEMP "binaryen"
          Invoke-WebRequest -Uri $url -OutFile $archive
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          tar -xf $archive -C $dest
          $bin = Join-Path $dest "binaryen-$ver\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & (Join-Path $bin "wasm-opt.exe") --version

      - name: Build web-chat (Leptos/WASM UI)
        working-directory: web-chat
        run: trunk build --release

      - name: Build websockets-chat (Leptos/WASM UI)
        working-directory: websockets-chat
        run: trunk build --release

      - name: Build release binaries
        run: cargo build --release --bin rust-bot --bin gmail-auth --target x86_64-pc-windows-msvc

      - name: Assemble package
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stageName = "rust-bot-$version-windows-x86_64"
          $archiveName = "$stageName.zip"

          New-Item -ItemType Directory -Path $stageName | Out-Null
          New-Item -ItemType Directory -Path "$stageName\configuration\samples" -Force | Out-Null

          Copy-Item "target\x86_64-pc-windows-msvc\release\rust-bot.exe" -Destination "$stageName\rust-bot.exe"
          Copy-Item "target\x86_64-pc-windows-msvc\release\gmail-auth.exe" -Destination "$stageName\gmail-auth.exe"
          Copy-Item "packaging\INSTALL.md" -Destination "$stageName\INSTALL.md"
          Copy-Item "packaging\samples\*" -Destination "$stageName\configuration\samples\"
          Copy-Item "web-chat\dist" -Destination "$stageName\web" -Recurse
          Copy-Item "websockets-chat\dist" -Destination "$stageName\websockets" -Recurse

          Compress-Archive -Path $stageName -DestinationPath $archiveName -Force

          "archive=$archiveName" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Rust Bot ${{ steps.version.outputs.tag }}
          body: |
            Automated release for Rust Bot ${{ steps.version.outputs.tag }}.

            Platform packages:
            - rust-bot-${{ steps.version.outputs.version }}-windows-x86_64.zip
            - rust-bot-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            - rust-bot-${{ steps.version.outputs.version }}-macos-aarch64.tar.gz

            Each package bundles the `rust-bot` and
            `gmail-auth` binaries (the gateway web UI is compiled into
            `rust-bot`), the web-chat UI assets under `web/`,
            the websockets-chat UI assets under `websockets/`
            (optional `--web-root` override),
            sample configurations under `configuration/samples/`, and an
            `INSTALL.md` with setup instructions.
          files: ${{ steps.package.outputs.archive }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
