name: Release (macOS)

on:
  push:
    branches:
      - deployment

permissions:
  contents: write

jobs:
  build-package-release:
    name: Build, package and release (macos-aarch64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version from Cargo.toml
        id: version
        shell: bash
        run: |
          version=$(awk -F'"' '/^\[package\]/{found=1; next} /^\[/{found=0} found && /^version[[:space:]]*=/{print $2; exit}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "Could not determine [package].version from Cargo.toml" >&2
            exit 1
          fi
          echo "Resolved version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag is not already used by another commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if ref_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" 2>/dev/null); then
            existing_sha=$(echo "$ref_json" | jq -r '.object.sha')
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              echo "Tag $tag already exists at $existing_sha (current commit is $GITHUB_SHA). Bump the version in Cargo.toml before releasing again." >&2
              exit 1
            fi
            echo "Tag $tag already points at the current commit; continuing."
          else
            echo "Tag $tag does not exist yet; it will be created by this release."
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-aarch64-apple-darwin

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build web-chat (Leptos/WASM UI)
        working-directory: web-chat
        run: trunk build --release

      - name: Build release binaries
        run: cargo build --release --bin rust-bot --bin generate-jwt --bin gmail-auth --target aarch64-apple-darwin

      - name: Assemble package
        id: package
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          stage_name="rust-bot-${version}-macos-aarch64"
          archive_name="${stage_name}.tar.gz"

          mkdir -p "${stage_name}/configuration/samples"
          cp "target/aarch64-apple-darwin/release/rust-bot" "${stage_name}/rust-bot"
          cp "target/aarch64-apple-darwin/release/generate-jwt" "${stage_name}/generate-jwt"
          cp "target/aarch64-apple-darwin/release/gmail-auth" "${stage_name}/gmail-auth"
          cp "packaging/INSTALL.md" "${stage_name}/INSTALL.md"
          cp packaging/samples/* "${stage_name}/configuration/samples/"
          cp -r web-chat/dist "${stage_name}/web"
          chmod +x "${stage_name}/rust-bot" "${stage_name}/generate-jwt" "${stage_name}/gmail-auth"

          tar czf "$archive_name" "$stage_name"

          echo "archive=$archive_name" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Rust Bot ${{ steps.version.outputs.tag }}
          body: |
            Automated release for Rust Bot ${{ steps.version.outputs.tag }}.

            Platform packages:
            - rust-bot-${{ steps.version.outputs.version }}-windows-x86_64.zip
            - rust-bot-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            - rust-bot-${{ steps.version.outputs.version }}-macos-aarch64.tar.gz

            Each package bundles the `rust-bot`, `generate-jwt`, and
            `gmail-auth` binaries, the web-chat UI assets under `web/`,
            sample configurations under `configuration/samples/`, and an
            `INSTALL.md` with setup instructions.
          files: ${{ steps.package.outputs.archive }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
