[package]
name = "websockets-chat"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "websockets-chat"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", features = ["http", "websocket"] }
gloo-storage = "0.3"
chat-ui = { path = "../chat-ui" }
# Split gloo-net's WebSocket into a SplitSink/SplitStream pair (StreamExt::split,
# SinkExt::send) in src/api/ws_client.rs.
futures = "0.3"
# client_id/turn_id are generated in-browser; "js" is required for uuid's RNG
# to work under wasm32-unknown-unknown (there is no OS RNG to fall back to).
uuid = { version = "1", features = ["v4", "js"] }
# Reconnect backoff delay (app.rs::schedule_reconnect), matching the version
# scheme of this crate's other gloo-* deps.
gloo-timers = { version = "0.3", features = ["futures"] }
# HtmlElement/Element/CssStyleDeclaration/ScrollBehavior/ScrollIntoViewOptions
# match web-chat's list (message_list.rs's auto-scroll uses the same
# NodeRef<Div>::set_scroll_top/scroll_height pattern); Location is additional
# here for app.rs's window().location() WebSocket URL construction.
web-sys = { version = "0.3", features = [
    "HtmlElement",
    "Element",
    "CssStyleDeclaration",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "Window",
    "Location",
] }
