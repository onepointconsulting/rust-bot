[package]
name = "web-chat"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "web-chat"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", features = ["http"] }
gloo-storage = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
web-sys = { version = "0.3", features = [
    "HtmlElement",
    "HtmlTextAreaElement",
    "HtmlInputElement",
    "Element",
    "CssStyleDeclaration",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "Window",
    "Navigator",
    "Clipboard",
    "File",
    "FileList",
    "FileReader",
    "Blob",
    "ProgressEvent",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "DragEvent",
    "ClipboardEvent",
] }
