[build]
target = "index.html"
dist = "dist"

# Pin the Tailwind CLI: style/input.css and tailwind.config.js use v3 syntax,
# and Trunk otherwise downloads the latest (v4), which drops most utilities.
[tools]
tailwindcss = "3.3.5"

[watch]
watch = ["src", "index.html", "style", "tailwind.config.js", "../chat-ui/src", "../chat-ui/style"]

[serve]
address = "127.0.0.1"
port = 8901
open = false

[[proxy]]
backend = "http://127.0.0.1:8900/v1/"

[[proxy]]
backend = "http://127.0.0.1:8900/health"

[[proxy]]
backend = "http://127.0.0.1:8900/swagger-ui/"

[[proxy]]
backend = "http://127.0.0.1:8900/api-docs/"
