# Cargo ignores `rustflags` under [target.*] in Cargo.toml; it must live here.
# Link with lld on Linux release builds to keep binary size/link times down.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# The browser frontends (websockets-chat, web-chat) render large nested SVG/view types.
# In an unoptimized `trunk build`/`trunk serve` every level of that recursion has a big
# stack frame, and the default 1 MiB wasm stack overflows while the first page renders.
# A wasm stack overflow shows up as "RuntimeError: memory access out of bounds", then
# every later call into the module fails the same way. 8 MiB leaves plenty of headroom.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=8388608"]
