[package]
name = "rust-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
home = "0.5.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = {version = "1.0", features = ["preserve_order"]}
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
similar = "2"
globwalk = "0.9"
futures = "0.3"
log = "0.4.29"
env_logger = "0.11.10"
rand = "0.10.0"
async-openai = { version = "0.34.0", features = ["chat-completion"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip", "socks"] }
uuid = { version = "1.23.0", features = ["v4"] }
dotenv = "0.15.0"
sha1 = "0.11.0"
hex = "0.4.3"
git2 = "0.20"
tera = "1"
regex = "1"
base64 = "0.22"
chrono-tz = "0.9"
croner = "2"
async-trait = "0.1"
tiktoken-rs = "0.10.0"
garde = { version = "0.22.1", features = ["full"] }
url = "2"
ipnet = "2.12.0"
rmcp = { version = "1.6.0", features = ["client", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
http = "1"
ctor = "1.0.2"
which = "6"
glob = "0.3.3"
html-escape = "0.2.13"
dom_smoothie = "0.17.0"
clap = { version = "4", features = ["derive"] }
anstyle = "1"
termimad = "0.34.1"
indicatif = "0.18.4"
reedline = "0.48.0"

[dev-dependencies]
tempfile = "3"
# Extra rmcp features needed only for integration tests (server, macros, schemars)
rmcp = { version = "1.6.0", features = ["server", "macros", "schemars"] }
