[package]
name = "rust-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
home = "0.5.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
similar = "2"
globwalk = "0.9"
futures = "0.3"
log = "0.4.29"
env_logger = "0.11.10"
rand = "0.10.0"
async-openai = "0.34.0"
uuid = { version = "1.23.0", features = ["v4"] }
