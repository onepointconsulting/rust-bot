[workspace]
members = [".", "web-chat"]
default-members = ["."]
resolver = "2"

[package]
name = "rust-bot"
version = "0.1.6"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
home = "0.5.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = {version = "1.0", features = ["preserve_order"]}
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time", "net", "signal"] }
similar = "2"
globwalk = "0.9"
futures = "0.3"
log = "0.4.29"
env_logger = "0.11.10"
rand = "0.10.0"
async-openai = { version = "0.34.0", features = ["chat-completion"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip", "socks", "multipart"] }
uuid = { version = "1.23.0", features = ["v4"] }
dotenv = "0.15.0"
sha1 = "0.11.0"
hex = "0.4.3"
git2 = "0.20"
tera = "1"
regex = "1"
base64 = "0.22"
chrono-tz = "0.9"
croner = "2"
async-trait = "0.1"
tiktoken-rs = "0.10.0"
garde = { version = "0.22.1", features = ["full"] }
url = "2"
ipnet = "2.12.0"
rmcp = { version = "1.6.0", features = ["client", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
http = "1"
ctor = "1.0.2"
which = "6"
glob = "0.3.3"
html-escape = "0.2.13"
dom_smoothie = "0.17.0"
clap = { version = "4", features = ["derive"] }
anstyle = "1"
termimad = "0.34.1"
indicatif = "0.18.4"
reedline = "0.48.0"
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.17"
crossterm = "0.29"
yup-oauth2 = "12.1.2"
adk-anthropic = "1.0.0"
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
rdocx = "0.1.2"
async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
mailparse = "0.16.1"
lettre = { version = "0.11.22", features = ["tokio1", "tokio1-native-tls"] }
html2md = "0.2.15"
inquire = "0.9.4"
# Default features include `simd`, which needs nightly (`portable_simd`).
# Keep the rest of the defaults for stable builds.
whatsapp-rust = { version = "0.6", default-features = false, features = [
    "moka-cache",
    "sqlite-storage",
    "tokio-transport",
    "tokio-runtime",
    "ureq-client",
    "tokio-native",
    "signal",
] }
whatsapp-rust-tokio-transport = "0.6"
whatsapp-rust-ureq-http-client = "0.6"
qrcode = {version = "0.14.1"}
rust-embed = "8.11"
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
ed25519-dalek = { version = "2.1", features = ["pem", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
pkcs8 = { version = "0.10", features = ["std"] }
argon2 = "0.5.3"

# On Linux, statically link OpenSSL so release binaries do not require libssl.so.3.
# Windows/macOS use platform TLS (SChannel / Secure Transport), so this is Linux-only.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"
# Extra rmcp features needed only for integration tests (server, macros, schemars)
rmcp = { version = "1.6.0", features = ["server", "macros", "schemars"] }

# crossterm 0.29 does not parse bracketed paste on Windows; WT sends ESC[200~…ESC[201~
# but the stock parser ignores it and conhost injects raw text instead.
# See https://github.com/crossterm-rs/crossterm/pull/1030
[patch.crates-io]
crossterm = { git = "https://github.com/eitsupi/crossterm", branch = "feature/windows-vt-input" }
# whatsapp-rust 0.6.0 with the self-DM fanout fix backported from upstream
# PR #634 ("fix: self-DM stops working"). Without it, every reply in the
# WhatsApp self-chat encrypts each own device twice (LID + PN namespace),
# logs "session with <lid> not found. Skipping." and the server rejects the
# stanza, so replies never reach the phone. Drop this patch once a release
# newer than 0.6.0 is published on crates.io.
whatsapp-rust = { path = "vendor/whatsapp-rust" }

[profile.release]
opt-level = "z"
lto = true
